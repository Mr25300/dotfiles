compression: auto,zstd
encryption_passphrase: ${BORG_PASSPHRASE}

archive_name_format: "{host}-{scope}-{now:%Y-%m-%d-%H%M%S}"

exclude_caches: true

keep_daily: 4
keep_weekly: 3
keep_monthly: 2

checks:
  - name: repository
    frequency: 1 week
  - name: data
    frequency: 1 month

check_last: 3

commands:
  - before: action
    when: [create]
    run:
      - 'notify-send "Borgmatic" "Started backup: {repository_label}"'
  - after: action
    when: [create]
    run:
      - 'notify-send "Borgmatic" "Finished backup: {repository_label}"'
  - before: action
    when: [prune]
    run:
      - 'notify-send "Borgmatic" "Started prune: {repository_label}"'
  - after: action
    when: [prune]
    run:
      - 'notify-send "Borgmatic" "Finished prune: {repository_label}"'
  - before: action
    when: [check]
    run:
      - 'notify-send "Borgmatic" "Started check: {repository_label}"'
  - after: action
    when: [check]
    run:
      - 'notify-send "Borgmatic" "Finished check: {repository_label}"'
  - before: action
    when: [compact]
    run:
      - 'notify-send "Borgmatic" "Started compact: {repository_label}"'
  - after: action
    when: [compact]
    run:
      - 'notify-send "Borgmatic" "Finished compact: {repository_label}"'
  - after: error
    when: [create, prune, check, compact]
    run:
      - 'notify-send "Borgmatic" "An error occurred: {error}" --urgency=critical'
