compression: auto,zstd
encryption_passphrase: ${BORG_PASSPHRASE}

archive_name_format: "${HOST}-${USER}-{now:%Y-%m-%d-%H%M%S}"

exclude_caches: true

repositories:
  - path: sagittarius-borg:/data/backups/borg/${HOST}
    label: sagittarius
  - path: /data/backups/borg-${HOST}
    label: local

keep_daily: 7
keep_weekly: 4
keep_monthly: 6

actions:
  - create
  - prune
  - compact
  - check

checks:
  - name: repository
    frequency: 1 week
  - name: data
    frequency: 1 month

check_last: 3

commands:
  - before: action
    when: [create]
    run:
      - notify-send "Borgmatic" "Started backup"
  - after: action
    when: [create]
    run:
      - notify-send "Borgmatic" "Finished backup"
  - name: error
    when: [create, prune, compact, check]
    run:
      - notify-send "Borgmatic" "Error during backup, prune, compact, or check" --urgency=critical
